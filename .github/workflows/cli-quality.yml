name: CLI quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format-and-test:
    name: Rust format and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Install embedded core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e core

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust CLI tests
        run: cargo test --locked --manifest-path cli/Cargo.toml
