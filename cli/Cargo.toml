[package]
name = "proto-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Local-first coding-agent CLI and TUI powered by ProtoLink."
license = "MIT"
repository = "https://github.com/nMaroulis/protoagent"
homepage = "https://nmaroulis.github.io/protoagent/"
readme = "README.md"

[dependencies]
tokio = { version = "1.53.3", features = ["full"] }
inquire = "0.9.4"
indicatif = "0.18.6"
console = "0.16.6"
crossterm = "0.29.0"
anyhow = "1.0.104"
pyo3 = { version = "0.29.3", features = ["auto-initialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# Keep local development and test artifacts small. Tests inherit this profile.
[profile.dev]
debug = 0
incremental = false
