[package]
name = "proto-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
description = "Local-first coding-agent CLI and TUI powered by ProtoLink."
license = "MIT"
repository = "https://github.com/nMaroulis/protoagent"
homepage = "https://nmaroulis.github.io/protoagent/"
readme = "README.md"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
inquire = "0.7.5"
indicatif = "0.17.8"
console = "0.15.8"
crossterm = "0.25.0"
anyhow = "1.0.81"
pyo3 = { version = "0.28.3", features = ["auto-initialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
