[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protoagent-core"
version = "0.1.0"
description = "Shared Python runtime core for ProtoAgent frontends."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "protolink[http,llms]>=0.6.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["protoagent_core*"]
